<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel Backoffice</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>


<body class="bg-light">


    <!-- NAVBAR -->

    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <span class="navbar-brand">
                Telco Backend
            </span>


            <div class="text-white">

                Usuario:
                <strong id="username"></strong>


                <button id="logoutButton" class="btn btn-outline-light btn-sm ms-3">

                    Cerrar sesión

                </button>

            </div>

        </div>

    </nav>



    <main class="container py-4">


        <!-- TÍTULO -->

        <div class="mb-4">

            <h2>Panel de Backoffice</h2>

            <p class="text-muted">
                Revisa y valida las ventas pendientes.
            </p>

        </div>



        <!-- MENSAJES -->

        <div id="successMessage" class="alert alert-success d-none">
        </div>


        <div id="errorMessage" class="alert alert-danger d-none">
        </div>



        <!-- VENTAS PENDIENTES -->

        <div class="card shadow-sm">


            <div class="card-header d-flex justify-content-between align-items-center">

                <h5 class="mb-0">
                    Ventas pendientes
                </h5>


                <button id="actualizarButton" class="btn btn-outline-primary btn-sm">

                    Actualizar

                </button>

            </div>



            <div class="card-body">


                <div class="table-responsive">


                    <table class="table table-hover align-middle">


                        <thead class="table-light">

                            <tr>

                                <th>Cliente</th>

                                <th>DNI</th>

                                <th>Producto</th>

                                <th>Plan nuevo</th>

                                <th>Monto</th>

                                <th>Fecha</th>

                                <th>Acciones</th>

                            </tr>

                        </thead>


                        <tbody id="ventasTableBody">


                            <tr>

                                <td colspan="8" class="text-center text-muted">

                                    Cargando ventas...

                                </td>

                            </tr>


                        </tbody>


                    </table>


                </div>

            </div>

        </div>


    </main>



    <!-- MODAL RECHAZAR -->

    <div class="modal fade" id="rechazarModal" tabindex="-1" aria-hidden="true">


        <div class="modal-dialog">


            <div class="modal-content">


                <div class="modal-header">

                    <h5 class="modal-title">
                        Rechazar venta
                    </h5>


                    <button type="button" class="btn-close" data-bs-dismiss="modal">
                    </button>

                </div>



                <div class="modal-body">


                    <input type="hidden" id="ventaIdRechazar">


                    <label for="motivoRechazo" class="form-label">

                        Motivo del rechazo

                    </label>


                    <textarea id="motivoRechazo" class="form-control" rows="4"
                        placeholder="Ingrese el motivo del rechazo" required>
                    </textarea>


                    <div id="modalError" class="text-danger mt-2 d-none">
                    </div>

                </div>



                <div class="modal-footer">


                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">

                        Cancelar

                    </button>


                    <button type="button" id="confirmarRechazoButton" class="btn btn-danger">

                        Rechazar venta

                    </button>


                </div>


            </div>

        </div>

    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="/src/js/backoffice/backoffice.js"></script>


</body>

</html>
